# Practice repo URL is the in-cluster Git server. With GitHub, replace repoURL / sourceRepos with your own repo URL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sneaky
  namespace: argocd
spec:
  project: atithi
  source:
    repoURL: http://gitserver.default.svc/config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
