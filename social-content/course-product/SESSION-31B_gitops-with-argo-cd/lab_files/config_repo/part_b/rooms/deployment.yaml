apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms
spec:
  replicas: 2
  selector:
    matchLabels: {app: rooms}
  template:
    metadata:
      labels: {app: rooms}
    spec:
      containers:
        - name: rooms
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
