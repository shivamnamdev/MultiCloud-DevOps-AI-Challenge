apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms-service
  namespace: atithi
spec:
  replicas: 2
  selector:
    matchLabels: {app: rooms}
  template:
    metadata:
      labels: {app: rooms}
    spec:
      containers:
      - name: rooms
        image: atithi-demo:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: SERVICE_NAME, value: rooms}
        envFrom:
        - configMapRef: {name: rooms-config}
        ports:
        - {name: http, containerPort: 5000}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rooms-service
  namespace: atithi
spec:
  selector: {app: rooms}
  ports:
  - {name: http, port: 5000, targetPort: http}
