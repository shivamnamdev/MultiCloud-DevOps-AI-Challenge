apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: atithi
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - {name: http, containerPort: 80}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: atithi
spec:
  selector: {app: web}
  ports:
  - {name: http, port: 80, targetPort: http}
