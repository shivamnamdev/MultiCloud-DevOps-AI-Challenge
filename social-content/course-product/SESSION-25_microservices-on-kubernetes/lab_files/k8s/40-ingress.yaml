apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atithi
  namespace: atithi
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - {path: /api/rooms,    pathType: Prefix, backend: {service: {name: rooms-service,    port: {number: 5000}}}}
      - {path: /api/bookings, pathType: Prefix, backend: {service: {name: bookings-service, port: {number: 5000}}}}
      - {path: /,             pathType: Prefix, backend: {service: {name: web,              port: {number: 80}}}}
