apiVersion: v1
kind: ServiceAccount
metadata: {name: bookings-sa, namespace: atithi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: configmap-reader, namespace: atithi}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: bookings-reads-configmaps, namespace: atithi}
subjects:
- {kind: ServiceAccount, name: bookings-sa, namespace: atithi}
roleRef: {kind: Role, name: configmap-reader, apiGroup: rbac.authorization.k8s.io}
