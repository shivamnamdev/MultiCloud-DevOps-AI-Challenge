# Replace YOUR_ACR_NAME with your registry name (the part before .azurecr.io).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: rooms-service }
  template:
    metadata:
      labels: { app: rooms-service }
    spec:
      containers:
        - name: rooms-service
          image: YOUR_ACR_NAME.azurecr.io/rooms-service:1.0
          ports: [ { containerPort: 8080 } ]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rooms-service
spec:
  type: LoadBalancer
  selector: { app: rooms-service }
  ports:
    - port: 80
      targetPort: 8080
