apiVersion: batch/v1
kind: Job
metadata: {name: job-classic}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: work, image: busybox:1.36, command: ["/bin/sh","-c","echo working; sleep 5; echo done"]}
      - {name: shipper, image: busybox:1.36, command: ["/bin/sh","-c","tail -f /dev/null"]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: job-native}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - {name: shipper, image: busybox:1.36, restartPolicy: Always, command: ["/bin/sh","-c","tail -f /dev/null"]}
      containers:
      - {name: work, image: busybox:1.36, command: ["/bin/sh","-c","echo working; sleep 5; echo done"]}
---
