apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-blue}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop, color: blue}}
  template:
    metadata: {labels: {app: shop, color: blue}}
    spec:
      containers: [{name: c, image: hashicorp/http-echo:1.0, args: ["-text=v1 BLUE", "-listen=:5678"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-green}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop, color: green}}
  template:
    metadata: {labels: {app: shop, color: green}}
    spec:
      containers: [{name: c, image: hashicorp/http-echo:1.0, args: ["-text=v2 GREEN", "-listen=:5678"]}]
---
apiVersion: v1
kind: Service
metadata: {name: shop}
spec:
  selector: {app: shop, color: blue}
  ports: [{port: 80, targetPort: 5678}]
