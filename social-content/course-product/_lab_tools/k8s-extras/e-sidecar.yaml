apiVersion: v1
kind: Pod
metadata: {name: sidecar-classic}
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh","-c","i=0; while true; do echo \"$(date +%T) booking $i\" >> /var/log/app/app.log; i=$((i+1)); sleep 2; done"]
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  - name: log-shipper
    image: busybox:1.36
    command: ["/bin/sh","-c","tail -n+1 -F /var/log/app/app.log"]
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  volumes: [{name: logs, emptyDir: {}}]
---
apiVersion: v1
kind: Pod
metadata: {name: sidecar-native}
spec:
  initContainers:
  - name: log-shipper
    image: busybox:1.36
    restartPolicy: Always
    command: ["/bin/sh","-c","touch /var/log/app/app.log; tail -n+1 -F /var/log/app/app.log"]
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  containers:
  - name: app
    image: busybox:1.36
    command: ["/bin/sh","-c","i=0; while true; do echo \"$(date +%T) booking $i\" >> /var/log/app/app.log; i=$((i+1)); sleep 2; done"]
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  volumes: [{name: logs, emptyDir: {}}]
