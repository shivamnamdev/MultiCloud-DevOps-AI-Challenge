name: aws-oidc
on: workflow_dispatch

# id-token: write lets the job ask GitHub for a short-lived identity token. No AWS key is stored anywhere.
permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      # Print only the role session id. The full output also contains the account number, and this repo's logs are public.
      - run: aws sts get-caller-identity --query UserId --output text
