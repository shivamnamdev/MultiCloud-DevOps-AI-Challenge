name: deploy
on:
  workflow_dispatch:
    inputs:
      note:
        description: A word for the log
        default: practice

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir dist && cp app.py dist/ && echo "built ${{ github.run_id }}" > dist/BUILD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # a human must approve before this job starts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Use the secret without printing it
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: echo "token length=${#DEMO_TOKEN}"
      - run: cat BUILD
