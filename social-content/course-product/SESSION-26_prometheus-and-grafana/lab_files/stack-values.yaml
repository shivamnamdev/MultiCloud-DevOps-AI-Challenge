# Lighter settings for a laptop cluster. Not for production.
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
grafana:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
